[build]
  publish = "."

[build.environment]
  # La llave de Google Maps/Places va en index.html a propósito (es pública y se restringe por dominio).
  SECRETS_SCAN_OMIT_PATHS = "index.html"

[functions]
  directory = "netlify/functions"

# Rutas: la raíz manda a la carta local; /delivery queda bloqueado (CONFIG.soloLocal) y vuelve a /carta
[[redirects]]
  from = "/"
  to = "/carta"
  status = 302
  force = true

[[redirects]]
  from = "/carta"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/carta/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/delivery"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/delivery/"
  to = "/index.html"
  status = 200

# Panel de administración (cajeras): apagar productos y cambiar precios
[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin/"
  to = "/index.html"
  status = 200
