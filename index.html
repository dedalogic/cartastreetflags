<!DOCTYPE html>
<html lang="es" data-sl="b">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menú · Street Flags</title>
<meta name="description" content="Menú online de Street Flags. Hamburguesas, chicken, papas fritas, boxes y más.">
<meta name="theme-color" content="#232323">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="shortcut icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#232323; --panel:#2b2b2b; --surface:#2f2f2f; --line:#434343;
  --text:#f7f5f2; --muted:#b9b9b9;
  --pink:#FF56A7; --pink-hi:#ff7ab8; --pink-dim:rgba(255,86,167,.16);
  --blue:#81E6F8; --on:#232323;
  --r:14px;          /* una sola forma para todo: fotos, botones, formatos, paneles */
  --mw:108px;        /* ancho de la foto y del botón de precio (siempre iguales) */
  --display:"Lilita One","Baloo 2",system-ui,sans-serif;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
@media(min-width:600px){:root{--mw:128px}}
@media(max-width:340px){:root{--mw:92px}}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font:400 16px/1.5 var(--sans);
  padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--pink-hi);outline-offset:3px}

/* ---------- Cabecera ---------- */
.top{padding:calc(40px + env(safe-area-inset-top,0px)) 20px 32px;text-align:center}
.brand{font:400 clamp(48px,13vw,96px)/.9 var(--display);letter-spacing:.05em;color:var(--pink)}
.brand .logo{display:block;margin:0 auto;width:auto;height:auto;max-width:70%;max-height:clamp(56px,15vw,88px)}
.online-label{margin:12px 0 0;font-size:12px;font-weight:800;letter-spacing:.18em;color:var(--text)}
.online-note{margin:11px auto 0;max-width:520px;font-size:12px;line-height:1.35;color:var(--muted)}
.online-note b{color:var(--text);font-weight:700}
 .info{margin:12px auto 0;max-width:34ch;font-size:13px;line-height:1.45;color:var(--text);opacity:.78}

/* ---------- Navegación de categorías ---------- */
.nav{position:sticky;top:0;z-index:20;background:rgba(35,35,35,.94);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav-in{max-width:1160px;margin:0 auto;display:flex;align-items:center}
.nav ul{position:relative;flex:1;min-width:0;list-style:none;display:flex;gap:8px;overflow-x:auto;padding:12px 8px 12px 16px;scrollbar-width:none}
.cartbtn{position:relative;flex:none;width:44px;height:44px;margin:0 14px 0 4px;display:grid;place-items:center;border-radius:var(--r);border:1px solid var(--text);background:var(--text);color:#232323;transition:filter .15s}
.cartbtn::before{content:"";position:absolute;right:100%;top:-8px;bottom:-8px;width:20px;background:linear-gradient(to left,var(--bg),transparent);pointer-events:none}
.cartbtn:hover{filter:brightness(.92)}
.cartbtn.pop{animation:pop .35s}
.cbadge{position:absolute;top:-5px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;border:2px solid var(--bg);background:var(--pink);color:var(--on);font-size:11px;font-weight:700;line-height:16px;text-align:center}
.cbadge[hidden]{display:none}
.cbadge.pop{animation:pop .4s}
.nav ul::-webkit-scrollbar{display:none}
.nav a{display:flex;align-items:center;min-height:44px;white-space:nowrap;padding:2px 16px 0;border-radius:var(--r);
  border:1px solid var(--line);color:var(--muted);text-decoration:none;font:400 15px/1.2 var(--display);letter-spacing:.06em;
  transition:background .15s,border-color .15s}
.nav a:hover{border-color:var(--muted);color:var(--text)}
.nav a[aria-current="true"]{background:var(--pink);border-color:var(--pink);color:var(--on)}

/* ---------- Secciones ---------- */
main{max-width:1160px;margin:0 auto;padding:0 20px}
.cat{padding-top:64px;scroll-margin-top:64px}
.cat:first-of-type{padding-top:56px}
.cat:last-of-type{min-height:calc(100dvh - 140px)}
.cat h2{display:flex;align-items:center;gap:16px;font:400 clamp(36px,9.5vw,44px)/1 var(--display);letter-spacing:.04em;color:var(--pink)}
.cat h2::after{content:"";flex:1;height:1px;background:var(--line)}
.cat .note{margin-top:10px;color:var(--muted);font-size:14px;max-width:60ch}
.list{display:grid;grid-template-columns:1fr;column-gap:56px;margin-top:12px}
@media(min-width:880px){.list{grid-template-columns:1fr 1fr}}

.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 16px;padding:22px 0;border-bottom:1px solid var(--line)}
.item[hidden],.cat[hidden]{display:none!important}
.item h3{font:400 24px/1.05 var(--display);letter-spacing:.03em}
.item:last-child{border-bottom:0}
@media(min-width:880px){.list .item:nth-last-child(2):nth-child(odd){border-bottom:0}}
.item.nopic{align-items:center;padding:14px 0}
.item.nopic .row2{grid-column:2;grid-row:1;min-height:0}
.hd{grid-column:1;grid-row:1;display:grid;gap:5px;align-content:start;min-width:0}
.row2{min-height:44px;grid-column:1 / -1;display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap}
.act{margin-left:auto;width:var(--mw)}
.fmt[hidden],.offer[hidden]{display:none!important}
.opts[hidden],.offer[hidden]{display:none}
.offer{flex:1;min-width:0}
.offer.in{animation:fadeSlow .9s ease-out}
.fmt.in{animation:fadeSlow .6s ease-out}
.fmt.out,.offer.out{opacity:0;transition:opacity .28s ease}
@keyframes fadeSlow{from{opacity:0}to{opacity:1}}
.of{display:grid;gap:1px;width:100%;min-height:44px;padding:6px 16px 7px;border:1px solid var(--line);border-radius:var(--r);background:none;color:var(--text);text-align:left;transition:border-color .15s}
.of:hover{border-color:var(--muted)}
.of-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.of-h b{font:400 19px/1.05 var(--display);letter-spacing:.03em}
.of-h i{font-style:normal;font-size:14px;font-weight:600;color:var(--blue)}
.of-s{font-size:12px;line-height:1.3;color:var(--muted)}
.desc{margin:0;color:var(--muted);font-size:14px;line-height:1.45;max-width:46ch}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{min-height:44px;padding:0 14px;border-radius:var(--r);border:1px solid var(--line);background:none;color:var(--text);font-size:14px;font-weight:500;transition:border-color .15s,background .15s}
.opts button:hover{border-color:var(--muted)}
.opts button[aria-pressed="true"]{border-color:var(--text);background:rgba(255,255,255,.1)}
@keyframes open{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.pick{grid-column:1 / -1;display:grid;gap:8px}
.pick > .opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%}
.pick > .opts button{width:100%;padding-left:4px;padding-right:4px}
.pk-t{font-size:12px;color:var(--muted)}
.pk-err{margin:0;font-size:12px;color:#ff8a8a}
.pick.shake,.fmt.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.media{grid-column:2;grid-row:1;position:relative;width:var(--mw);height:var(--mw);align-self:start}
.media img,.ph{display:block;width:100%;height:100%;object-fit:cover;border-radius:var(--r)}
.ph{border:1px solid var(--line);
  background:repeating-linear-gradient(135deg,#2c2c2c 0 10px,#343434 10px 20px)}
.add{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:44px;padding:0 10px;border:0;border-radius:var(--r);background:var(--pink);color:var(--on);font-size:14px;font-weight:600;transition:background .18s ease,transform .24s cubic-bezier(.22,.72,.24,1)}
.add .pl{display:inline-flex;align-items:center;justify-content:center;font-size:18px;line-height:1;font-weight:500;transform:translateY(-.5px)}
.add .ap{display:inline-flex;align-items:center;line-height:1}
.add:hover{background:var(--pink-hi)}
@media(max-width:380px){
  .row2{gap:6px}
  .opts button{padding:0 9px}
  .of{padding:6px 12px 7px}
}
@media(max-width:340px){
  .opts button{padding:0 6px}
  .row2{gap:4px}
}
.zoom{display:block;width:100%;height:100%;padding:0;border:0;background:none;border-radius:var(--r);cursor:zoom-in}
.stp{display:flex;align-items:center;justify-content:space-between;width:100%;height:44px;border-radius:var(--r);background:var(--pink);color:var(--on)}
.stp[hidden],.add[hidden]{display:none}
.stp button{flex:0 0 40px;height:100%;border:0;background:none;color:var(--on);font-size:20px;line-height:1}
.stp span{flex:1;text-align:center;font-weight:700;font-size:16px}
.stp.pop{animation:pop .48s cubic-bezier(.22,.72,.24,1)}
.lb{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.96)}
.lb[hidden]{display:none}
.lb figure{display:grid;gap:12px;justify-items:center;text-align:center}
.lb img{display:block;max-width:min(92vw,820px);max-height:76dvh;border-radius:var(--r)}
.lb figcaption{font:400 24px/1.1 var(--display);letter-spacing:.03em;color:var(--text);max-width:46ch}
.lb figcaption small{display:block;margin-top:4px;color:var(--muted);font:400 14px/1.4 var(--sans)}
.lb-x{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;width:46px;height:46px;border-radius:var(--r);border:1px solid #4d4d4d;background:var(--panel);color:var(--text);font-size:20px}
@keyframes pop{0%{transform:scale(.982);opacity:.9}55%{transform:scale(1.012);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes softReveal{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.stp:not([hidden]){animation:softReveal .28s ease-out}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.add:active{transform:scale(.988)}

footer{max-width:1160px;margin:56px auto 0;padding:24px 20px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;display:grid;gap:6px}
footer b{color:var(--text);font-weight:600}

/* ---------- Bandeja inferior de sugerencias ---------- */
.dock{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;width:min(560px,calc(100% - 24px));
  transform:translateX(-50%);border-radius:var(--r);overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,.55);display:none}
.dock.on{display:block}
.suggest{padding:10px 12px;background:var(--blue);color:#232323}
.suggest[hidden]{display:none}
.suggest.in{animation:rise .5s ease-out}
.suggest.out{opacity:0;transform:translateY(6px);transition:opacity .18s ease,transform .18s ease}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sg-top b{font:400 19px/1.1 var(--display);letter-spacing:.03em;color:#232323}
.sg-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sg-x{flex:none;width:44px;height:44px;margin:-10px -10px -10px 0;border:0;border-radius:var(--r);background:none;color:#2c5a66;font-size:15px}
.sg-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.sg-add{flex:1 1 auto;white-space:nowrap;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;padding:0 14px;border-radius:var(--r);border:1px solid rgba(35,35,35,.28);background:#fff;color:#232323;font-size:14px;font-weight:500;text-align:left}
.sg-add b{display:inline-flex;align-items:center;gap:3px;font-weight:700;font-size:14px;color:#232323}
.sg-add b .pl{font-size:16px;line-height:1;font-weight:500}
.sg-add:hover{border-color:#232323}
body.has-sug{padding-bottom:calc(160px + env(safe-area-inset-bottom,0px))}

/* ---------- Panel del pedido ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:50;left:0;right:0;bottom:0;max-height:88dvh;display:flex;flex-direction:column;
  background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:var(--r) var(--r) 0 0;
  transform:translateY(105%);transition:transform .25s ease;overflow-y:auto;overscroll-behavior:contain}
.drawer > *{flex-shrink:0}
.drawer.on{transform:none}
@media(min-width:900px){
  .scrim{display:none}
  .drawer{left:auto;top:0;width:420px;max-height:none;border-radius:0;border-top:0;border-bottom:0;transform:translateX(105%)}
  body.panel-open .dock{display:none}
  main,footer{transition:margin .25s}
  body.panel-open main,body.panel-open footer{margin-right:max(20px,calc((100% - 1160px) / 2 + 420px - 20px))}
}
.dh{position:sticky;top:0;z-index:2;background:var(--panel);display:flex;justify-content:space-between;align-items:center;padding:20px 20px 12px}
.dh-main{display:flex;align-items:center;gap:6px;min-width:0}
.dh h2{font:400 24px/1 var(--display);letter-spacing:.03em}
.head-back{display:grid;place-items:center;width:44px;height:44px;margin-left:-10px;border:0;border-radius:var(--r);background:none;color:var(--text);font-size:22px;line-height:1}
.head-back[hidden]{display:none}
.x{width:44px;height:44px;border-radius:var(--r);border:1px solid var(--line);background:none;font-size:20px}
.lines{flex:1 1 auto;min-height:0;overflow-y:auto;padding:0 20px;-webkit-overflow-scrolling:touch}
.empty{padding:28px 0;color:var(--muted)}
.line{display:grid;grid-template-columns:56px minmax(0,1fr) auto;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.line b{font-weight:600}
.line small{display:block;color:var(--muted);font-size:12px}
.line-thumb,.line-thumb-ph{display:block;width:56px;height:56px;border-radius:var(--r);align-self:center}
.line-thumb{object-fit:cover;border:1px solid var(--line);background:#2c2c2c}
.line-thumb-ph{border:1px solid var(--line);background:repeating-linear-gradient(135deg,#2c2c2c 0 10px,#343434 10px 20px)}
.line-content{min-width:0}
.line-name{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.line-detail{margin-top:2px;line-height:1.35;display:-webkit-box!important;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.line-price{display:flex;align-items:baseline;gap:8px;margin-top:3px;min-width:0}
.line-total{white-space:nowrap}
.line-unit{min-width:0}
.qty{display:flex;align-items:center;gap:8px;flex:0 0 auto;align-self:center}
.qty button{width:44px;height:44px;border-radius:var(--r);border:1px solid var(--line);background:none;font-size:18px;line-height:1}
.qty span{min-width:18px;text-align:center;font-weight:600}
.df{margin-top:0;padding:16px 20px calc(20px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:grid;gap:10px;background:var(--panel);flex:0 0 auto}
#checkout1{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.checkout-step[hidden]{display:none!important}
.checkout-step.in{animation:checkoutIn .28s ease-out}
@keyframes checkoutIn{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
.step2-summary{padding:11px 13px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);font-size:13px;color:var(--muted)}
.next{min-height:48px;border-radius:var(--r);font-weight:600;font-size:15px;border:0;background:var(--pink);color:var(--on)}
.next:hover{background:var(--pink-hi)}
#checkout1 .next{position:static;box-shadow:none}
.df label{font-size:12px;color:var(--muted)}
.df input:not([type="radio"]),.df textarea{width:100%;margin-top:4px;padding:12px 13px;border-radius:var(--r);border:2px solid #fff;
  background:#fff;color:#232323;font:inherit;font-size:16px;resize:vertical}
.df input:not([type="radio"])::placeholder,.df textarea::placeholder{color:#8a8378}
.df input:not([type="radio"]):focus,.df textarea:focus{outline:none;border-color:var(--pink)}
.sug{padding:16px 0 8px}
.sug p{font-size:14px;color:var(--text);font-weight:600;margin-bottom:8px}
.sug-list{display:grid;gap:8px}
.sug-row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
.sug-copy{min-width:0;flex:1;display:grid;gap:2px}
.sug-topline{display:flex;align-items:baseline;gap:7px;min-width:0}
.sug-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:500}
.sug-badge{color:var(--blue);font-size:12px;font-weight:600;line-height:1.2}
.sug-price{color:var(--muted);font-size:14px;font-weight:500;white-space:nowrap}
.sug-add{width:44px;height:44px;min-width:44px;border-radius:var(--r);border:1px solid var(--line);background:none;color:var(--text);font-size:18px;line-height:1}
.sug-row .sug-add{border-color:var(--pink);background:var(--pink);color:var(--on)}
.sug-row .sug-add:hover{background:var(--pink-hi)}
.total{display:flex;justify-content:space-between;font-size:18px;font-weight:600;padding-top:4px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg.shake{animation:shake .35s}
.seg label{display:block;margin:0;color:var(--text)}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg>label>span{display:grid;grid-template-rows:auto auto;align-items:center;justify-items:center;min-height:44px;text-align:center;padding:9px 8px;border-radius:var(--r);border:1px solid var(--line);font-size:14px;font-weight:500;cursor:pointer}
.seg-main{grid-row:1}
.seg-sub{grid-row:2;color:var(--muted);font-size:12px;font-weight:400;line-height:1.25}
.seg input:checked + span{border-color:var(--text);background:rgba(255,255,255,.06)}
.seg input:focus-visible + span{outline:2px solid var(--text);outline-offset:2px}
.delivery-err{color:#ff8a8a;font-size:12px;min-height:0;margin:0}
.delivery-err:empty{display:none}
.err{color:#ff8a8a;font-size:12px;min-height:0}
.err:empty{display:none}
.hint{font-size:12px;color:var(--muted)}
  .dnote{margin:-4px 0 0;font-size:12px;color:var(--muted)}
.dnote[hidden]{display:none}
.checkout-info,.wa-hint{font-size:12px;line-height:1.45;color:var(--muted)}
.wa-fallback{font-size:12px;color:var(--text);text-underline-offset:2px;min-height:44px;display:flex;align-items:center}
.wa-fallback[hidden]{display:none}
.note-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:44px;padding:0;border:0;background:none;color:var(--text);font:inherit;font-size:14px;text-align:left}
.note-toggle span{color:var(--muted);font-size:18px;transition:transform .15s}
.note-toggle[aria-expanded="true"] span{transform:rotate(45deg)}
.note-wrap[hidden]{display:none}
.steps{margin:0 0 0 18px;padding:0;display:grid;gap:2px;font-size:12px;color:var(--muted)}
.pay{padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);font-size:12px}
.pay[hidden]{display:none}
.pay-t{margin-bottom:6px;font-size:14px}
.pay-t b{color:var(--blue)}
#payRows div{display:flex;justify-content:space-between;gap:12px;padding:2px 0}
#payRows span{color:var(--muted)}
#payRows b{font-weight:500;text-align:right}
.copy{margin-top:8px;padding:8px 14px;border-radius:var(--r);border:1px solid var(--line);background:none;font-size:14px}
.send{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 14px var(--panel);padding:15px;border:0;border-radius:var(--r);background:var(--pink);color:var(--on);font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px}
.send svg{width:20px;height:20px;flex:none}
.send:hover{background:var(--pink-hi)}
.send:disabled{opacity:.45;cursor:not-allowed}

@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{transition:none!important;animation:none!important}
}

/* ---------- Combo: etiqueta sobre la foto, interruptor y hoja ---------- */
.badge{position:absolute;left:0;top:0;z-index:2;padding:9px 15px 9px 12px;background:var(--pink);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.28);font-family:var(--display);font-size:15px;line-height:1;letter-spacing:.05em;text-transform:uppercase;border-radius:var(--r) 0 var(--r) 0;pointer-events:none;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.item:has(.badge) .media{box-shadow:0 0 0 2px var(--pink);border-radius:var(--r)}
.sh-screen{display:grid;gap:12px;animation:shin .22s ease}
@keyframes shin{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.sh-screen{animation:none}}
.sh-q{margin:0;font-family:var(--display);font-size:23px;line-height:1.12}
.sh-hint{margin:4px 0 0;color:var(--muted);font-size:13px}
.sh-hint .lim{color:var(--pink)}
.sh-top{font-style:normal;align-self:flex-start;width:fit-content;margin-top:3px;padding:2px 8px;border-radius:99px;background:var(--pink);color:#fff;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;vertical-align:middle}
.sh-tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sh-tiles.c3{grid-template-columns:repeat(3,1fr)}
.sh-tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 6px 9px;border:1px solid var(--line);border-radius:var(--r);background:none;color:var(--text);text-align:center}
.sh-tile .sh-thumb{width:64px;height:64px}
.sh-tiles.c3 .sh-thumb{width:50px;height:50px}
.sh-tile b{font-size:13px;font-weight:600;line-height:1.15}
.sh-tile i{font-style:normal;font-size:12px;color:var(--muted)}
.sh-tile .ck{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;color:transparent}
.sh-tile[data-selected="true"]{border-color:var(--pink);background:rgba(255,86,167,.12)}
.sh-tile[data-selected="true"] .ck{background:var(--pink);border-color:var(--pink);color:#fff}
.sh-tile[aria-disabled="true"]{opacity:.45}
.tag{position:absolute;left:8px;bottom:8px;z-index:2;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px 0 8px;border:0;border-radius:var(--r);background:rgba(35,35,35,.88);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:var(--text);font-size:12px;font-weight:600;transition:background .15s}
.tag[hidden],.tog[hidden]{display:none}
.tag .tp{display:grid;place-items:center;width:22px;height:22px;border-radius:var(--r);background:var(--pink);color:var(--on);font-size:15px;line-height:1}
.tag em,.tog em{font-style:normal;color:var(--blue)}
.tag[aria-checked="true"]{background:var(--text);color:#232323}
.tag[aria-checked="true"] em{color:#232323}
.tog{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:6px 10px;border:1px solid var(--line);border-radius:var(--r);background:none;color:var(--text);text-align:left;transition:border-color .15s,background .15s}
.tog .sw{flex:none;position:relative;width:32px;height:20px;border-radius:var(--r);background:var(--line);transition:background .15s}
.tog .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:var(--r);background:#fff;transition:transform .15s}
.tog[aria-checked="true"]{border-color:var(--text);background:rgba(255,255,255,.08)}
.tog[aria-checked="true"] .sw{background:var(--pink)}
.tog[aria-checked="true"] .sw::after{transform:translateX(12px)}
.tog .tt{flex:1;min-width:0;display:grid;line-height:1.25}
.tog .tt b{font-size:13px;font-weight:600}
.tog em,.tag em{white-space:nowrap}
.tog .tt small{font-size:12px;color:var(--muted)}
.row2 .tog{order:9;flex:1 1 100%}
.shbd{position:fixed;inset:0;z-index:54;background:rgba(0,0,0,.6)}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:55;width:min(560px,100%);padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:var(--r) var(--r) 0 0}
.shbd[hidden],.sheet[hidden]{display:none}
.sheet.in{animation:sheetUp .36s cubic-bezier(.22,.72,.24,1)}
@keyframes sheetUp{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translateX(-50%)}}
.sh-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sh-h b{display:block;font:400 24px/1.05 var(--display);letter-spacing:.03em}
.sh-h span{display:block;margin-top:4px;font-size:14px;color:var(--muted)}
.sh-g{display:grid;gap:8px}
.sh-opt{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 14px;border:1px solid var(--line);border-radius:var(--r);background:none;color:var(--text);text-align:left}
.sh-opt[aria-checked="true"]{border-color:var(--text);background:rgba(255,255,255,.08)}
.sh-opt .rd{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--muted)}
.sh-opt[aria-checked="true"] .rd{border-color:var(--pink);background:radial-gradient(var(--pink) 45%,transparent 50%)}
.sh-opt .tx{flex:1;min-width:0;display:grid;line-height:1.25}
.sh-opt .tx b{font-size:14px;font-weight:600}
.sh-opt .tx small{font-size:12px;color:var(--muted)}
.sh-opt i{font-style:normal;font-size:14px;font-weight:600}
.sh-opt.sh-extra[data-selected="true"]{border-color:var(--text);background:rgba(255,255,255,.08)}
.sh-opt.sh-extra[data-selected="true"] .rd{border-color:var(--pink);background:radial-gradient(var(--pink) 45%,transparent 50%)}
.sh-extra{cursor:pointer}
.sh-thumb{flex:none;width:44px;height:44px;border-radius:var(--r);object-fit:cover;border:1px solid var(--line);background:#2c2c2c}
.sh-add{min-height:48px}
.sh-step{display:grid;gap:10px;animation:shStepIn .26s cubic-bezier(.22,.72,.24,1)}
.sh-progress{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px}
.sh-back{min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:var(--r);background:none;color:var(--text);font-size:18px}
@keyframes shStepIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.sheet{max-height:88dvh;overflow-y:auto}
.sh-lab{margin:2px 0 8px;font-size:14px;font-weight:600}
.sh-lab small{font-weight:400;color:var(--muted)}
.exg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sh-chk{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:56px;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r);background:none;color:var(--text);text-align:left}
.sh-chk .tx{display:grid;line-height:1.2;min-width:0}
.sh-chk .tx b{font-size:14px;font-weight:600}
.sh-chk .tx small{font-size:12px;color:var(--muted)}
.sh-chk .bx{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:var(--r);border:1.5px solid var(--muted);font-size:15px;line-height:1}
.sh-chk[aria-checked="true"]{border-color:var(--text);background:rgba(255,255,255,.08)}
.sh-chk[aria-checked="true"] .bx{background:var(--pink);border-color:var(--pink);color:var(--on);font-size:13px}
.sh-qty{display:flex;align-items:center;gap:6px;flex:none}
.sh-qty button{width:44px;height:44px;min-height:44px;border:1px solid var(--line);border-radius:var(--r);background:none;color:var(--text);font-size:18px;line-height:1}
.sh-qty span{min-width:20px;text-align:center;font-size:14px;font-weight:600}
.of-s .p2{display:none}
html[data-layout="grid"] .of-h .p1{display:none}
html[data-layout="grid"] .of-s .p2{display:inline;font-style:normal;font-weight:600;color:var(--blue)}
html[data-layout="grid"] .cat:not(.compact) .row2 .tog{order:2;flex:none}
html[data-layout="grid"] .tog .sw{width:22px;height:22px;border-radius:var(--r);background:transparent;border:2px solid var(--muted)}
html[data-layout="grid"] .tog .sw::after{display:none}
html[data-layout="grid"] .tog[aria-checked="true"] .sw{background:var(--pink);border-color:var(--pink)}
html[data-layout="grid"] .tog[aria-checked="true"] .sw::before{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:var(--on);font-size:13px;line-height:1}
html[data-layout="grid"] .cat:not(.compact) .act{order:3}
html[data-layout="grid"] .cat:not(.compact) .fmt,html[data-layout="grid"] .cat:not(.compact) .offer{order:1}


/* Ajustes táctiles y de selección del modal */
button,a,[role="button"],[role="radio"]{touch-action:manipulation}
#combos .item h3{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#combos .desc{display:-webkit-box!important;-webkit-line-clamp:2!important;-webkit-box-orient:vertical;overflow:hidden}
html[data-layout="grid"] #combos .hd{min-height:58px}
.sh-step{padding-bottom:16px}
.sh-step .sh-g{gap:6px}
.sh-step .sh-opt{min-height:52px;padding-top:7px;padding-bottom:7px}
.sh-ex.is-missing .sh-opt,.sh-ex.is-missing .sh-chk{border-color:var(--pink)}

/* ---------- Variantes de tipografía ---------- */
html[data-type="contrast"] .item h3,html[data-type="contrast"] .sh-h b{font:700 20px/1.15 var(--sans);letter-spacing:0}
html[data-type="contrast"] .nav a{font:600 13px/1.2 var(--sans);letter-spacing:.05em;text-transform:uppercase}
html[data-type="contrast"] .of-h b{font:700 15px/1.15 var(--sans);letter-spacing:0}
html[data-type="contrast"] .sg-top b{font:700 16px/1.15 var(--sans);letter-spacing:0}
html[data-type="contrast"] .paynote b{font:700 14px/1.2 var(--sans);letter-spacing:0}
html[data-type="contrast"] .dh h2,html[data-type="contrast"] .lb figcaption{font:700 22px/1.15 var(--sans);letter-spacing:0}
html[data-type="weight"] .item h3{font-size:27px;letter-spacing:.04em;-webkit-text-stroke:.7px currentColor}
html[data-type="weight"] .cat h2{letter-spacing:.05em;-webkit-text-stroke:1px currentColor}
html[data-type="weight"] .nav a{-webkit-text-stroke:.35px currentColor}
html[data-type="weight"] .desc{color:#8e887d}

/* ---------- Variantes de foto ---------- */
html[data-layout="hero"] .cat:not(.compact) .list{grid-template-columns:1fr;gap:34px;margin-top:22px}
html[data-layout="hero"] .cat:not(.compact) .item{display:flex;flex-direction:column;align-items:stretch;gap:14px;padding:0;border-bottom:0}
html[data-layout="hero"] .cat:not(.compact) .media{order:1;width:100%;height:auto;aspect-ratio:4/3;overflow:hidden;border-radius:var(--r)}
html[data-layout="hero"] .cat:not(.compact) .hd{order:2}
html[data-layout="hero"] .cat:not(.compact) .pick{order:3}
html[data-layout="hero"] .cat:not(.compact) .row2{order:4}
@media(min-width:880px){html[data-layout="hero"] .cat:not(.compact) .list{grid-template-columns:1fr 1fr;gap:44px 32px}html[data-layout="hero"] .cat:not(.compact) .media{aspect-ratio:16/10}}
html[data-layout="grid"] .cat:not(.compact) .list{grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 12px;margin-top:22px}
html[data-layout="grid"] .cat:not(.compact) .item{display:flex;flex-direction:column;align-items:stretch;gap:10px;padding:0;border-bottom:0}
html[data-layout="grid"] .cat:not(.compact) .media{order:1;width:100%;height:auto;aspect-ratio:1/1;overflow:hidden;border-radius:var(--r)}
html[data-layout="grid"] .cat:not(.compact) .hd{order:2}
html[data-layout="grid"] .cat:not(.compact) .hd h3{font-size:20px}
html[data-layout="grid"] .cat:not(.compact) .pick,html[data-layout="grid"] .cat:not(.compact) .row2{margin-top:auto}
html[data-layout="grid"] .cat:not(.compact) .pick + .row2{margin-top:0}
html[data-layout="grid"] .cat:not(.compact) .desc{font-size:12px;display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical;overflow:hidden}
html[data-layout="grid"] .cat:not(.compact) .pick{order:3}
html[data-layout="grid"] .cat:not(.compact) .row2{order:4;flex-direction:column;align-items:stretch;gap:8px}
html[data-layout="grid"] .cat:not(.compact) .fmt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
html[data-layout="grid"] .cat:not(.compact) .opts button{padding:0 2px;min-height:44px;font-size:13px}
html[data-layout="grid"] .cat:not(.compact) .act{margin-left:0;width:100%}
@media(min-width:880px){html[data-layout="grid"] .cat:not(.compact) .list{grid-template-columns:repeat(3,minmax(0,1fr));gap:40px 24px}}

html[data-desc="one"] .desc{display:-webkit-box!important;-webkit-line-clamp:1!important;-webkit-box-orient:vertical;overflow:hidden}
html[data-desc="none"] .desc{display:none!important}
html[data-layout="grid"][data-desc="one"] .cat:not(.compact) .hd{min-height:50px}
html[data-layout="grid"][data-desc="none"] .cat:not(.compact) .hd{min-height:28px}
/* ---------- Panel de opciones de diseño ---------- */
.labbtn{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:45;min-height:44px;padding:0 16px;border-radius:var(--r);border:1px solid var(--text);background:var(--bg);color:var(--text);font-size:14px;font-weight:600}
.lab{position:fixed;left:12px;bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:45;width:min(340px,calc(100% - 24px));max-height:70dvh;overflow:auto;padding:12px 14px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);box-shadow:0 12px 32px rgba(0,0,0,.6)}
.lab[hidden]{display:none}
.lab-t{font-size:12px;color:var(--muted);margin:8px 0 6px}
.lab-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.lab-g button{min-height:44px;padding:0 4px;border-radius:var(--r);border:1px solid var(--line);background:none;font-size:14px;line-height:1.1}
.lab-g.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.lab-g button[aria-pressed="true"]{border-color:var(--text);background:rgba(255,255,255,.1)}

/* Ajustes de carrito y accesos */
.jump-card{width:100%}
.jump-card .add{width:100%}
@media(min-width:1100px){html[data-layout="grid"] #combos .list{grid-template-columns:repeat(4,minmax(0,1fr));gap:40px 24px}}
.paynote span{display:block;line-height:1.35}

/* ---------- Street Flags ---------- */
.online-label .p{color:var(--pink)}
.online-label .b{color:var(--blue)}
.brand{color:var(--pink)}
.add:disabled{background:transparent;border:1px solid var(--line);color:var(--muted);cursor:default;font-weight:500}
.sh-opt[aria-disabled="true"]{opacity:.42}
.sh-opt small.nt{display:block}
.more{width:100%;min-height:44px;margin-top:8px;border:1px solid var(--line);border-radius:var(--r);background:none;color:var(--text);font-size:14px;font-weight:500}
.more:hover{border-color:var(--muted)}
.lim{color:var(--pink-hi);font-weight:600}
.sheet .sh-add{position:sticky;bottom:0;box-shadow:0 -12px 14px var(--panel)}
.brand .logo{max-width:min(82%,460px);max-height:clamp(56px,16vw,96px)}
/* ---- hoja v2: una sola gramática visual en todos los pasos ---- */
.sheet.in{animation:sheetUp .32s ease-out}
@keyframes sheetUp{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translateX(-50%)}}
@keyframes shFade{from{opacity:0}to{opacity:1}}
.sh-screen{display:grid;gap:14px;animation:shFade .32s ease both}
.sh-screen.still{animation:none}
.sh-screen.tall{display:flex;flex-direction:column;min-height:min(500px,calc(88dvh - 96px))}
.sh-screen.tall .sh-add{margin-top:auto}
.sh-progress{min-height:36px}
.sh-screen .sh-back{min-width:36px;width:36px;min-height:36px;height:36px;padding:0;border-color:transparent;background:rgba(255,255,255,.07);font-size:16px;transition:opacity .2s}
.sh-screen .sh-back.is-off{visibility:hidden}
.sh-dots{display:flex;gap:6px}
.sh-dots i{width:20px;height:4px;border-radius:2px;background:var(--line);transition:background-color .3s ease}
.sh-dots i.on{background:var(--pink)}
.sh-qb{display:grid;gap:4px}
.sh-q{margin:0;font-family:var(--display);font-size:24px;line-height:1.1;letter-spacing:.01em}
.sh-hint{margin:0;color:var(--muted);font-size:13px;min-height:18px}
.sh-hint .lim{color:var(--pink)}
.sh-opt,.sh-tile,.sh-opt .rd,.sh-tile .ck{transition:border-color .22s ease,background-color .22s ease,opacity .22s ease}
.sh-opt[aria-checked="true"],.sh-opt.sh-extra[data-selected="true"],.sh-tile[data-selected="true"]{border-color:var(--pink);background:rgba(255,86,167,.10)}
.sh-add[aria-disabled="true"]{opacity:.45}
.sh-tiles{gap:8px}
.sh-tiles.c3{gap:6px}
.sh-tiles.c3 .sh-tile{padding:8px 4px 7px}
.sh-tiles.c3 .sh-thumb{width:44px;height:44px}
.sh-top{margin-top:2px}
.sh-tile[aria-checked="true"]{border-color:var(--pink);background:rgba(255,86,167,.10)}
.sh-tile[aria-checked="true"] .ck{background:var(--pink);border-color:var(--pink);color:#fff}
.sh-tile .ck{transition:background-color .22s ease,border-color .22s ease}
@media(max-height:700px){.sh-q{font-size:21px}.sh-screen{gap:10px}.sh-tile .sh-thumb{width:46px;height:46px}.sh-tiles.c3 .sh-thumb{width:36px;height:36px}.sh-tile{padding:8px 6px 7px;gap:3px}.sh-screen.tall{min-height:0}}
/* ---- v3 ---- */
.sh-search{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 14px;border:1px solid var(--line);border-radius:var(--r);color:var(--muted);transition:border-color .22s ease}
.sh-search:focus-within{border-color:var(--pink);color:var(--text)}
.sh-search input{flex:1;min-width:0;height:46px;border:0;outline:0;background:none;color:var(--text);font:inherit;font-size:16px}
.sh-search input::placeholder{color:var(--muted)}
.sh-search input::-webkit-search-cancel-button{-webkit-appearance:none}
.sh-empty{margin:0;padding:18px 4px;color:var(--muted);font-size:14px;text-align:center}
.sh-tile .tt{display:grid;gap:2px}
.sh-tiles:not(.h){flex:1;min-height:0;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:10px}
.sh-tiles:not(.h) .sh-tile{justify-content:center;gap:8px;padding:12px 8px;min-height:0}
.sh-tiles:not(.h) .sh-tile .sh-thumb{flex:1 1 56px;min-height:56px;max-height:124px;width:auto;height:auto;max-width:78%;aspect-ratio:1/1;border-radius:16px}
.sh-tiles:not(.h) .sh-tile b{font-size:15px}
.sh-tiles:not(.h) .sh-tile i{font-size:13px}
.sh-tiles:not(.h) .ck{top:10px;right:10px;width:22px;height:22px}
.sh-tiles.h{grid-template-columns:1fr 1fr;gap:8px}
.sh-tiles.h .sh-tile{flex-direction:row;align-items:center;text-align:left;gap:10px;padding:8px 34px 8px 8px;min-height:60px}
.sh-tiles.h .sh-tile .sh-thumb{width:44px;height:44px;flex:none}
.sh-tiles.h .sh-tile b{font-size:13px}
.sh-screen.tall{min-height:min(500px,calc(88dvh - 96px))}
.sh-screen.tall:has(.sh-qb.mas){min-height:min(580px,calc(88dvh - 70px))}
.sh-qb.mas{position:relative;min-height:128px;align-content:center}
.sh-qb.mas .sh-q,.sh-qb.mas .sh-hint{max-width:58%}
.sh-mascot{position:absolute;right:-4px;top:-2px;height:134px;width:auto;z-index:3;pointer-events:none;filter:drop-shadow(1.5px 0 0 #fff) drop-shadow(-1.5px 0 0 #fff) drop-shadow(0 1.5px 0 #fff) drop-shadow(0 -1.5px 0 #fff)}
@media(max-height:700px){.sh-screen.tall{min-height:0}.sh-qb.mas{min-height:84px}.sh-mascot{height:88px}.sh-tiles:not(.h) .sh-tile .sh-thumb{flex-basis:44px;min-height:44px}.sh-tiles:not(.h) .sh-tile{padding:8px 6px;gap:4px}}
@media(max-height:700px){.sh-screen.tall:has(.sh-qb.mas){min-height:0}.sh-screen{gap:8px}.sh-progress{min-height:32px}.sh-screen .sh-back{width:32px;min-width:32px;height:32px;min-height:32px}.sh-qb.mas{min-height:72px}.sh-mascot{height:80px}.sh-q{font-size:20px}.sh-tiles:not(.h) .sh-tile .sh-thumb{flex-basis:36px;min-height:36px}.sh-tiles:not(.h) .sh-tile{padding:6px 4px;gap:2px}.more{min-height:38px;margin-top:0}.sh-tiles.h .sh-tile{min-height:54px;padding-top:5px;padding-bottom:5px}}
/* ---- v4: tarjetas de salsa = la foto ocupa todo el cuadro ---- */
.lnk{display:inline;padding:6px 0;border:0;background:none;color:var(--pink);font:inherit;font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer}

const ANALYTICS_SEEN = new Set();
function track(event, props={}){
  try{
    if (!window.posthog || typeof window.posthog.capture !== "function") return;
    window.posthog.capture(event, Object.assign({
      site:"Street Flags",
      path:location.pathname,
      device:window.matchMedia("(max-width: 700px)").matches ? "mobile" : "desktop"
    }, props));
  }catch(e){}
}
function trackOnce(key, event, props={}){
  if (ANALYTICS_SEEN.has(key)) return;
  ANALYTICS_SEEN.add(key);
  track(event, props);
}

function loadFont(family, file, varName, fallback){
  if (!file) return;
  const ext = file.indexOf("data:") === 0 ? file.slice(5).split(/[;,]/)[0].split("/").pop() : file.split(".").pop().toLowerCase();
  const fmt = { woff2:"woff2", woff:"woff", ttf:"truetype", otf:"opentype" }[ext];
  if (file.indexOf("data:") !== 0 && ext){      /* precarga: evita ver otra letra un instante */
    const l = document.createElement("link"); l.rel = "preload"; l.as = "font"; l.type = "font/" + ext; l.crossOrigin = ""; l.href = file; document.head.appendChild(l);
  }
  const st = document.createElement("style");
  st.textContent = `@font-face{font-family:"${family}";src:url("${file}")${fmt ? ` format("${fmt}")` : ""};font-style:normal;font-weight:400;font-display:swap}`;
  document.head.appendChild(st);
  document.documentElement.style.setProperty(varName, `"${family}",${fallback}`);
}

/* ---------- Render de la carta ---------- */
const comboOf = (it, o) => it.combo ? (it.combo.byOption ? it.combo.byOption[o] : it.combo.all) : null;
const servingLabel = (it, o) => {
  if (!it.options || !it.options[o]) return "";
  const label = it.options[o].label;
  if (label === "Slice") return "1 trozo";
  if (label === "40 cm") return "2–3 personas";
  if (label === "60 cm") return "6–8 personas";
  return "";
};
const comboNeedsDrink = (it, o) => {
  const cb = comboOf(it, o);
  return !!(cb && /Bebida/i.test(cb.desc || ""));
};
const comboDrinkKind = (it, o) => {
  const cb = comboOf(it, o), desc = (cb && cb.desc) || "";
  return /Bebida\s*mini/i.test(desc) ? "mini" : (/Bebida\s*1[.,]?5\s*L/i.test(desc) ? "1.5 L" : "");
};
const drinkChoices = (it, o=0, ci=0) => {
  if (it.drinkChoice && Array.isArray(it.drinkChoice.list)) return it.drinkChoice.list;
  if (ci && comboDrinkKind(it, o) === "mini") return ["Coca-Cola Original","Coca-Cola Zero","Sprite","Fanta"];
  return ["Coca-Cola Original","Coca-Cola Zero"];
};
const drinkSuffix = (it, o=0, ci=0) => {
  if (it.drinkChoice) return it.drinkChoice.suffix || "";
  return ci ? comboDrinkKind(it, o) : "";
};
const drinkDisplay = (it, o, ci, vi) => {
  if (vi < 0) return "";
  const name = drinkChoices(it, o, ci)[vi] || "", suffix = drinkSuffix(it, o, ci);
  return [name, suffix].filter(Boolean).join(" ");
};
const pickName = (it, pi) => (it.pick && pi >= 0 && it.pick.list && it.pick.list[pi] != null) ? it.pick.list[pi] : null;
const basePrice = (it, o, pi=-1) => {
  if (it.options) return it.options[o].price;
  const pk = pickName(it, pi);
  if (it.priceByPick && pk && it.priceByPick[pk] != null) return it.priceByPick[pk];
  return it.price;
};
const unitPrice = (it, o, c, pi=-1) => basePrice(it, o, pi) + (c && comboOf(it, o) ? comboOf(it, o).extra : 0);
const isCompact = id => { const c = MENU.find(c => c.items.some(i => i.id === id)); return !!(c && c.compact); };
const assetPath = f => {

};

  return assetPath(f);
};

/* ---------- Zonas de delivery ---------- */
const ZONAS = typeof ZONAS_DELIVERY !== "undefined" ? ZONAS_DELIVERY : [];
const zonasListas = () => typeof DELIVERY_GEO !== "undefined" && ZONAS.length > 0;

/* latitud de un corte en una longitud dada (interpola; fuera de sus extremos se prolonga en línea recta horizontal) */
const _cut = {};
function cutLat(name, lng){
  const L = _cut[name] || (_cut[name] = DELIVERY_GEO.cortes[name].slice().sort((p, q) => p[1] - q[1]));
  if (lng <= L[0][1]) return L[0][0];
  if (lng >= L[L.length - 1][1]) return L[L.length - 1][0];
  for (let i = 1; i < L.length; i++) if (lng <= L[i][1]){ const a = L[i - 1], b = L[i], d = b[1] - a[1]; return d ? a[0] + (b[0] - a[0]) * (lng - a[1]) / d : Math.max(a[0], b[0]); }
  return L[L.length - 1][0];
}
/* zona de un punto: franjas de norte a sur. Sobre el corte exacto cae la zona de arriba (la de tarifa menor). */
function zoneAt(lat, lng){
  const g = DELIVERY_GEO; if (lat > g.norte || lat < g.sur || lng > g.este || lng < g.oeste) return null;
  let k = 0; for (; k < g.orden.length; k++) if (lat >= cutLat(g.orden[k], lng)) break;
  const id = g.zonas[k]; return ZONAS.find(z => z.id === id) || null;
}

const isIquique = r => { const a = r.address || {}, c = norm(a.city || a.town || a.village || a.municipality || ""); if (c) return c === "iquique"; const n = norm(r.display_name || ""); return n.indexOf("iquique") >= 0 && n.indexOf("hospicio") < 0; };
const geoLabel = r => { const a = r.address || {}, road = a.road || a.pedestrian || a.footway || "", num = a.house_number ? " " + a.house_number : "", sub = a.suburb || a.neighbourhood || a.quarter || ""; const dn = (r.display_name || "").split(",").map(x => x.trim()); return (road ? road + num : dn[0]) + (sub ? ", " + sub : (dn[1] && dn[1] !== road ? ", " + dn[1] : "")); };

async function buscarDireccion(){

    const res = await fetch(url); if (!res.ok) throw new Error("http"); const js = await res.json(); if (my !== geoSeq) return;

const GKEY = (CONFIG.googleKey || "").trim();
let gReady = null, gTok = null, gTimer = 0, gSeq = 0, gSug = [], gAct = -1, gFailed = false;
const useGoogle = () => !!GKEY && !gFailed;
function applyProvider(){ $("#addrGo").hidden = useGoogle(); $("#caddr").setAttribute("enterkeyhint", useGoogle() ? "done" : "search"); }
function loadGoogle(){

    if (j.simulacion) box.innerHTML = "<b>Simulación (no se envió nada)</b><pre>" + esc(JSON.stringify(j.payload, null, 1)) + "</pre>";
    else if (j.ok){ box.className = "zone-box ok"; box.innerHTML = "<b>Pedido enviado a Toteat ✓</b><span class=\"zm\">Referencia " + esc(j.ref) + ". Revisa que salga la comanda en el local.</span>"; }
    else { box.className = "zone-box bad"; box.innerHTML = "<b>Toteat no recibió el pedido</b><pre>" + esc(JSON.stringify(j.toteat || j.error || j, null, 1).slice(0, 900)) + "</pre>"; }
  } catch(e){ box.className = "zone-box bad"; box.innerHTML = "<b>No se pudo enviar.</b> Revisa tu conexión."; }
  finally { send.disabled = false; }
}

$("#send").addEventListener("click", () => {
  const { sum, ls } = totals(); if (!ls.length) return;
  const name = $("#cname").value.trim(), addr = $("#caddr").value.trim(), note = $("#cnote").value.trim();
  const delivery = tipo() === "delivery", err = $("#err");
  if (!name){ err.textContent = "Escribe tu nombre."; $("#cname").focus(); return; }
  const phoneDigits = $("#cphone").value.replace(/\D/g, "");
  if (phoneDigits.length < 8 || phoneDigits.length > 12){ err.textContent = "Escribe tu teléfono para coordinar el pedido."; $("#cphone").focus(); return; }
  const phone = phoneDigits.length === 9 ? "56" + phoneDigits : (phoneDigits.length === 8 ? "569" + phoneDigits : phoneDigits);
  if (miniQty() > burgerQty()){ err.textContent = "La bebida mini es 1 por cada burger. Quita " + (miniQty() - burgerQty()) + " bebida(s) mini o suma otra burger."; return; }
  if (delivery && addr.length < 5){ err.textContent = "Escribe tu dirección para el delivery."; $("#caddr").focus(); return; }
  if (delivery && DEL.st === "out"){ err.textContent = "Esa dirección está fuera de cobertura. Elige retiro en local."; return; }
  if (delivery && DEL.st !== "ok" && DEL.st !== "unconf"){ err.textContent = DEL.st === "pin" ? "Marca tu casa en el mapa para calcular el delivery." : (useGoogle() ? "Elige tu dirección de la lista de sugerencias." : "Toca Buscar para calcular tu delivery."); if (DEL.st === "idle") (useGoogle() ? $("#caddr") : $("#addrGo")).focus(); return; }
  err.textContent = "";
  const unit = $("#cunit").value.trim(), fee = delivery ? feeNow() : 0;
  track("whatsapp_click", {fulfillment:delivery ? "delivery" : "retiro", order_total:sum, cart_items:ls.reduce((a,l)=>a+l.qty,0), product_ids:ls.map(l=>l.it.id)});
  saveProfile();

  const orderLine = l => {
    const bits = [l.it.name];
    const parsed = parseKey(l.k), pk = parsed.it.pick;
    if (parsed.it.options) bits[0] += " " + parsed.it.options[parsed.oi].label;
    if (pk) bits.push((pk.msg !== undefined ? pk.msg : "salsa ") + pk.list[parsed.pi]);
    if (parsed.ci) bits.push("combo");
    if (parsed.vi >= 0) bits.push(drinkDisplay(parsed.it, parsed.oi, parsed.ci, parsed.vi));
    return l.qty + "x " + bits.join(", ") + " " + fmt(l.qty * l.price);
  };
  const txt = [
    delivery ? "*DELIVERY*" : "*RETIRO EN LOCAL*",
    "Hola, quiero realizar este pedido:",
    "",
    ...ls.map(orderLine),
    "",
    "Subtotal: " + fmt(sum),
    delivery && fee ? "Delivery (" + DEL.zone.nombre + "): " + fmt(fee) : null,
    delivery && !fee ? "Delivery: se confirma por WhatsApp" : null,
    "*Total: " + fmt(sum + fee) + (delivery && !fee ? " + delivery" : "") + "*",
    "Pago: transferencia",
    "",
    "Nombre: " + name,
    "Teléfono: +" + phone,
    delivery ? "Dirección: " + addr + (unit ? ", " + unit : "") : null,
    delivery && DEL.lat != null ? "Ubicación: https://www.google.com/maps?q=" + DEL.lat.toFixed(6) + "," + DEL.lon.toFixed(6) : null,
    note ? "Nota: " + note : null
  ].filter(x => x !== null).join("\n");
  const waUrl = "https://wa.me/" + CONFIG.whatsapp + "?text=" + encodeURIComponent(txt);
  if (PRUEBA.key){
    enviarPrueba({ k: PRUEBA.key, simular: PRUEBA.sim, prueba: true, tipo: delivery ? "delivery" : "retiro", fee,
      cliente: { nombre: name, telefono: phone, direccion: addr, detalle: unit, lat: delivery ? DEL.lat : null, lon: delivery ? DEL.lon : null, nota: note },
      lineas: ls.map(l => { const ps = parseKey(l.k), pk = ps && ps.it.pick; return { pick: pk ? pk.list[ps.pi] : "", pickKind: pk ? (pk.lab === "con " ? "side" : "sauce") : "", id: l.it.id, name: orderLine(l).replace(/^\d+x /, "").replace(/ \$[\d.]+$/, ""), qty: l.qty, price: l.price }; }) });
    return;
  }
  const fallback = $("#waFallback"); fallback.href = waUrl; fallback.hidden = false;
  window.open(waUrl, "_blank", "noopener");
});


/* ---------- Opciones de diseño (solo en la versión de prueba) ---------- */
if (CONFIG.opciones){
  const G = [
    ["foto", "Foto", [["lista","Lista"],["hero","Foto arriba"],["grid","Grilla de 2"]]],
    ["tipografia", "Tipografía", [["actual","Actual"],["contrast","Contraste"],["weight","Con peso"]]],
    ["cta", "Cómo ofrecer el combo", [["actual","Después de agregar"],["toggle","Interruptor"],["tag","Etiqueta en la foto"],["sheet","Hoja al agregar"]]],
    ["desc", "Descripción del plato", [["full","Completa"],["one","1 línea"],["none","Sin"]]]
  ];
  const labBtn = document.createElement("button"); labBtn.className = "labbtn"; labBtn.type = "button"; labBtn.textContent = "Opciones de diseño"; labBtn.setAttribute("aria-expanded", "false");
  const labBox = document.createElement("div"); labBox.className = "lab"; labBox.hidden = true;
  const draw = () => { labBox.innerHTML = G.map(([k, t, o]) => `<p class="lab-t">${t}</p><div class="lab-g${o.length === 4 ? " two" : ""}">${o.map(([v, n]) => `<button type="button" data-lab="${k}:${v}" aria-pressed="${DESIGN[k] === v}">${n}</button>`).join("")}</div>`).join(""); };
  draw();
  labBtn.addEventListener("click", () => { labBox.hidden = !labBox.hidden; labBtn.setAttribute("aria-expanded", String(!labBox.hidden)); });
  labBox.addEventListener("click", e => {
    const b = e.target.closest("[data-lab]"); if (!b) return;
    const [k, v] = b.dataset.lab.split(":"); DESIGN[k] = v; applyDesign(); hideOffer(); renderCart();
    try { localStorage.setItem("streetflags_diseno_v1", JSON.stringify(DESIGN)); } catch(_){}
    draw();
  });
  document.body.append(labBox, labBtn);
}

showCheckoutStep(1, false);
renderCart();

  window.addEventListener("scroll", function(){ if (!tk) { tk = true; requestAnimationFrame(chk); } }, { passive: true });

<script>
(function(){
  function paint(im){
    try {
      var m = im.closest && im.closest(".media"); if (!m || m.closest("#salsas") || !im.naturalWidth) return;
      var c = document.createElement("canvas"); c.width = 4; c.height = 40; var x = c.getContext("2d");
      x.drawImage(im, 0, 0, 4, 40); var t = x.getImageData(0, 1, 4, 1).data, b = x.getImageData(0, 38, 4, 1).data;
      var f = a => "rgb(" + [0,1,2].map(i => Math.round((a[i] + a[4+i] + a[8+i] + a[12+i]) / 4)).join(",") + ")";
      m.style.background = "linear-gradient(" + f(t) + "," + f(b) + ")";
    } catch (e) {}
  }
  document.addEventListener("load", function(e){ if (e.target && e.target.tagName === "IMG") paint(e.target); }, true);
  window.addEventListener("load", function(){ document.querySelectorAll(".media img").forEach(function(i){ if (i.complete) paint(i); }); });
})();
</script>
<script>
window.addEventListener("load", function(){
  var box = document.getElementById("slider"), tr = document.getElementById("slTrack"), dots = document.getElementById("slDots");
  if (!box || !tr) return;
  function n(){ return tr.children.length; }
  function idx(){ return Math.round(tr.scrollLeft / tr.clientWidth); }
  function to(i){ var k = n(); if (!k) return; i = (i % k + k) % k; tr.scrollTo({ left: i * tr.clientWidth, behavior: "smooth" }); }
  ["l","r"].forEach(function(d){
    var b = document.createElement("button"); b.type = "button"; b.className = "sl-arr " + d; b.setAttribute("aria-label", d === "l" ? "Anterior" : "Siguiente"); b.textContent = d === "l" ? "‹" : "›";
    b.addEventListener("click", function(e){ e.stopPropagation(); to(idx() + (d === "l" ? -1 : 1)); });
    box.appendChild(b);
  });
  if (dots) [].forEach.call(dots.children, function(el, i){ el.addEventListener("click", function(){ to(i); }); });
  var down = false, x0 = 0, s0 = 0, moved = false;
  tr.addEventListener("mousedown", function(e){ if (e.button) return; down = true; moved = false; x0 = e.clientX; s0 = tr.scrollLeft; });
  window.addEventListener("mousemove", function(e){ if (!down) return; var dx = e.clientX - x0; if (Math.abs(dx) > 5 && !moved){ moved = true; tr.classList.add("drag"); } if (moved) tr.scrollLeft = s0 - dx; });
  window.addEventListener("mouseup", function(e){ if (!down) return; down = false; if (moved){ var dx = e.clientX - x0; tr.classList.remove("drag"); var i = idx(); to(dx < -40 ? Math.ceil(s0 / tr.clientWidth + .01) : dx > 40 ? Math.floor(s0 / tr.clientWidth - .01) : Math.round(s0 / tr.clientWidth)); } });
  tr.addEventListener("click", function(e){ if (moved){ e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
});
</script>
